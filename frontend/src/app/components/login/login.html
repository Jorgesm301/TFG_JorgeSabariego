<div class="page">
  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a routerLink="/" class="brand">
        <span class="brand-logo">🏟️</span>
        <div class="brand-text">
          <div class="brand-name">Polideportivo Municipal</div>
          <div class="brand-sub">Reservas · Partidos · Nivel ERO</div>
        </div>
      </a>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <div class="logo">🏃</div>
        <h1 class="title">Iniciar Sesión</h1>
        <p class="subtitle">Accede a tu cuenta de ERO</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label class="label">Email</label>
          <input
            type="email"
            formControlName="email"
            class="input"
            placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label class="label">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="input"
            placeholder="••••••••">
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-solid btn-full">
          Entrar
        </button>
      </form>

      <div class="card-footer">
        <p class="footer-text">
          ¿No tienes cuenta?
          <a routerLink="/registro" class="link">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
