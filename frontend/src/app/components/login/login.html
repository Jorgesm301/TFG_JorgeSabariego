<div class="page">
  <header class="header">
    <div class="header-inner">
      <a routerLink="/" class="brand">
        <img src="/logo.svg" alt="JS Logo" class="logo-img">
      </a>
    </div>
  </header>

  <div class="login-container">
    <mat-card class="login-card">
      <mat-card-header class="card-header">
        <mat-card-title class="title">Iniciar Sesión</mat-card-title>
        <mat-card-subtitle class="subtitle">Accede a tu cuenta de ELO</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <mat-icon matPrefix>email</mat-icon>
            <input
              matInput
              type="email"
              formControlName="email"
              placeholder="tu@email.com">
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              El email es obligatorio
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Email inválido
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input
              matInput
              type="password"
              formControlName="password"
              placeholder="••••••••">
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              La contraseña es obligatoria
            </mat-error>
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="loginForm.invalid"
            class="full-width submit-btn">
            <mat-icon>login</mat-icon>
            Entrar
          </button>
        </form>

        <div class="separator">
          <span>o</span>
        </div>

        <button
          mat-stroked-button
          type="button"
          class="full-width google-btn"
          (click)="loginConGoogle()">
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-icon">
          Continuar con Google
        </button>

        <p *ngIf="googleError" class="google-error">
          No se pudo iniciar sesión con Google. Inténtalo de nuevo.
        </p>
      </mat-card-content>

      <mat-card-footer class="card-footer">
        <p class="footer-text">
          ¿No tienes cuenta?
          <a routerLink="/registro" class="link">Regístrate aquí</a>
        </p>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
