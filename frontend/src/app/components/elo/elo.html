<div class="elo-page">
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <button class="back-button" (click)="volverPerfil()">
        <span class="back-icon">←</span>
      </button>
      <h1 class="page-title">Mis Niveles ELO</h1>
      <div></div>
    </div>
  </header>

  <!-- Contenido -->
  <div class="elo-content">
    <!-- Loading state -->
    <div class="loading-state" *ngIf="cargandoElo">
      <div class="spinner"></div>
      <p>Cargando tus niveles...</p>
    </div>

    <!-- Deportes con ELO -->
    <div class="deportes-grid" *ngIf="!cargandoElo && deportesElo.length > 0">
      <div class="deporte-card" *ngFor="let deporte of deportesElo">
        <div class="deporte-header">
          <div class="deporte-icon">🏅</div>
          <div class="deporte-titulo">
            <h3 class="deporte-nombre">{{ deporte.sport_name }}</h3>
            <p class="deporte-partidos">{{ deporte.matches_played }} partidos jugados</p>
          </div>
        </div>
        <div class="deporte-elo">
          <div class="elo-badge-large">{{ deporte.elo }}</div>
          <div class="elo-label">Nivel ELO</div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="!cargandoElo && deportesElo.length === 0">
      <span class="empty-icon">🎯</span>
      <h2 class="empty-title">Sin niveles ELO</h2>
      <p class="empty-text">Aún no tienes nivel ELO en ningún deporte</p>
      <p class="empty-hint">Crea tu primera reserva y juega un partido para obtener tu nivel inicial</p>
      <button class="primary-button" routerLink="/">
        Explorar Deportes
      </button>
    </div>
  </div>
</div>
