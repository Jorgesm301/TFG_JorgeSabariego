<div class="page">

  <!-- HEADER a ancho completo -->
  <header class="header">
    <div class="header-inner">
      <a routerLink="/" class="brand">
        <span class="logo" aria-hidden="true">🏟️</span>
        <div class="brand-text">
          <div class="brand-name">Polideportivo Municipal</div>
          <div class="brand-sub">Reservas · Partidos · Nivel ERO</div>
        </div>
      </a>

      <div class="actions">
        <!-- Mostrar cuando NO está logueado -->
        <ng-container *ngIf="!estaLogueado">
          <button class="btn btn-ghost" (click)="irALogin()">Iniciar sesión</button>
          <button class="btn btn-solid" (click)="irARegistro()">Registrarse</button>
        </ng-container>

        <!-- Mostrar cuando SÍ está logueado -->
        <div *ngIf="estaLogueado" class="user-profile" (click)="irAPerfil()">
          <span class="user-name">👤 {{ nombreUsuario }}</span>
        </div>
      </div>
    </div>
  </header>

  <!-- SUBCABECERA con menús desplegables -->
  <nav class="subheader">
    <div class="subheader-inner">
      <!-- Menú Reservar -->
      <div class="menu-item" [class.active]="menuReservarAbierto" (mouseenter)="abrirMenuReservar()" (mouseleave)="cerrarMenuReservar()">
        <button class="menu-btn">
          <span>Reservar</span>
        </button>
        <div class="dropdown" *ngIf="menuReservarAbierto">
          <a
            *ngFor="let deporte of deportesMenu"
            class="dropdown-item"
            (click)="navegarADeporte(deporte.ruta)"
          >
            <span class="dropdown-icon">{{ deporte.icon }}</span>
            <span>{{ deporte.nombre }}</span>
          </a>
        </div>
      </div>

      <!-- Menú Mis Reservas -->
      <a routerLink="/mis-reservas" class="menu-item">
        <button class="menu-btn">
          <span>Mis Reservas</span>
        </button>
      </a>

    </div>
  </nav>

  <!-- CONTENIDO centrado -->
  <main class="content">

    <!-- TÍTULO PRINCIPAL -->
    <div class="hero-text">
      <h1 class="hero-title">Reserva pistas y únete a partidos equilibrados</h1>
      <p class="hero-subtitle">Gestiona reservas y juega con personas de tu mismo nivel</p>
    </div>

    <!-- SLIDER -->
    <section class="slider" aria-label="Galería de deportes">
      <div class="slider-frame">
        <img
          class="slide-image"
          [src]="slides[currentIndex].imageUrl"
          [alt]="slides[currentIndex].title"
          (error)="onImageError($event)"
          loading="eager"
        />

        <div class="slide-overlay">
          <div class="slide-title">{{ slides[currentIndex].title }}</div>
          <div class="slide-sub">{{ slides[currentIndex].subtitle }}</div>
        </div>

        <button class="nav-arrow left" (click)="prevSlide()" aria-label="Anterior">‹</button>
        <button class="nav-arrow right" (click)="nextSlide()" aria-label="Siguiente">›</button>
      </div>

      <div class="dots" role="tablist" aria-label="Seleccionar imagen">
        <button
          class="dot"
          *ngFor="let s of slides; let i = index"
          [class.active]="i === currentIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir a ' + s.title"
        ></button>
      </div>

      <div class="slide-actions-bottom">
        <button class="btn btn-solid btn-lg" (click)="reservarAhora()">Reserva ahora</button>
      </div>
    </section>

  </main>
</div>
