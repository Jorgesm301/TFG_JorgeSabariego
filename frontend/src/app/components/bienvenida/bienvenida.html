<div class="page">

  <!-- HEADER MATERIAL TOOLBAR -->
  <mat-toolbar class="header">
    <a routerLink="/" class="brand">
      <div class="brand-icon">
        <mat-icon>sports_soccer</mat-icon>
      </div>
      <div class="brand-text">
        <div class="brand-name">Polideportivo Municipal</div>
        <div class="brand-sub">Reservas · Partidos · Nivel ELO</div>
      </div>
    </a>

    <span class="spacer"></span>

    <div class="actions">
      <!-- Mostrar cuando NO está logueado -->
      <ng-container *ngIf="!estaLogueado">
        <button mat-button (click)="irALogin()">Iniciar sesión</button>
        <button mat-raised-button color="primary" (click)="irARegistro()">Registrarse</button>
      </ng-container>

      <!-- Mostrar cuando SÍ está logueado -->
      <button *ngIf="estaLogueado" mat-button (click)="irAPerfil()">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ nombreUsuario }}</span>
      </button>
    </div>
  </mat-toolbar>

  <!-- SUBHEADER CON MATERIAL MENU -->
  <nav class="subheader">
    <div class="subheader-inner">
      <!-- Menú Reservar -->
      <button mat-button [matMenuTriggerFor]="reservarMenu" class="nav-button">
        <mat-icon>event_available</mat-icon>
        <span>Reservar</span>
        <mat-icon class="arrow-icon">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #reservarMenu="matMenu" class="deportes-menu">
        <button
          mat-menu-item
          *ngFor="let deporte of deportesMenu"
          (click)="navegarADeporte(deporte.ruta)"
        >
          <mat-icon>{{ deporte.icon }}</mat-icon>
          <span>{{ deporte.nombre }}</span>
        </button>
      </mat-menu>

      <!-- Menú Mis Reservas -->
      <button mat-button routerLink="/mis-reservas" class="nav-button">
        <mat-icon>book_online</mat-icon>
        <span>Mis Reservas</span>
      </button>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">

    <!-- TÍTULO PRINCIPAL -->
    <div class="hero-text">
      <h1 class="hero-title">Reserva pistas y únete a partidos equilibrados</h1>
      <p class="hero-subtitle">Gestiona reservas y juega con personas de tu mismo nivel</p>
    </div>

    <!-- SLIDER CON MATERIAL CARD -->
    <section class="slider" aria-label="Galería de deportes">
      <mat-card class="slider-card">
        <div class="slider-frame">
          <img
            class="slide-image"
            [src]="slides[currentIndex].imageUrl"
            [alt]="slides[currentIndex].title"
            (error)="onImageError($event)"
            loading="eager"
          />

          <div class="slide-overlay">
            <div class="slide-title">{{ slides[currentIndex].title }}</div>
            <div class="slide-sub">{{ slides[currentIndex].subtitle }}</div>
          </div>

          <button mat-icon-button class="nav-arrow left" (click)="prevSlide()" aria-label="Anterior">
            <mat-icon>chevron_left</mat-icon>
          </button>
          <button mat-icon-button class="nav-arrow right" (click)="nextSlide()" aria-label="Siguiente">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </div>

        <div class="dots" role="tablist" aria-label="Seleccionar imagen">
          <button
            class="dot"
            *ngFor="let s of slides; let i = index"
            [class.active]="i === currentIndex"
            (click)="goTo(i)"
            [attr.aria-label]="'Ir a ' + s.title"
          ></button>
        </div>
      </mat-card>
    </section>

  </main>
</div>
